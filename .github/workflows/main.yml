name: main

on:
  - push
  - pull_request

jobs:
  main:
    name: 'Test and Lint (TS ${{ matrix.typescript }})'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: ['5', '6']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - run: npm install

      - name: Pin TypeScript ${{ matrix.typescript }}
        run: npm install --no-save typescript@${{ matrix.typescript }}

      - run: npm test

      - run: npm run lint
